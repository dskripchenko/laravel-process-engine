name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    name: Pint · PHPStan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        db: ['sqlite', 'pgsql', 'mysql']
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.db }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: process_engine_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: process_engine_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PE_DB: ${{ matrix.db }}
      PE_DB_PASSWORD: secret
      PE_DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, pcntl, posix
          coverage: none

      - name: Use the published core
        run: |
          composer config --unset repositories.0 || true
          composer require "dskripchenko/process-engine:^1.0" --no-interaction --no-update

      - name: Pin Laravel version
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      # Laravel 11 is past its security-fix window, so current Composer refuses
      # to resolve laravel/framework 11.x. This job checks compatibility for
      # existing L11 apps with committed locks, not new L11 installs.
      - name: Allow EOL framework resolution (Laravel 11 only)
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false

      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
